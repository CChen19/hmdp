version: "3.8"

# Local MySQL + Redis for host-run app (mvn / scripts/start-backend.sh).
# Override credentials via env — do not commit new secrets.
# Example:
#   MYSQL_PASSWORD=001020 REDIS_PASSWORD=001020 docker compose up -d
#   export MYSQL_HOST=127.0.0.1 REDIS_HOST=127.0.0.1
#   mvn -DskipTests package && ./scripts/start-backend.sh

services:
  mysql:
    image: mysql:8.0
    container_name: hmdp-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-001020}"
      MYSQL_DATABASE: hmdp
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - hmdp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-001020}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hmdp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-001020}"]
    volumes:
      - hmdp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-001020}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hmdp-mysql-data:
  hmdp-redis-data:
